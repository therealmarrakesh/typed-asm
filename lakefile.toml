# Not a program to run: instructions the type system rejects, with the
# messages it gives, checked at build time.
[[lean_lib]]
name = "Rejected"
srcDir = "examples/Rejected"

# Tests: `lake test` checks the model against results recorded from the GNU
# assembler and from a real processor. `lake exe capture` regenerates those
# results, which needs x86-64 Linux with `as` and `cc`.

[[lean_lib]]
name = "Tests"
srcDir = "tests"

[[lean_exe]]
name = "tests"
root = "TestsMain"
srcDir = "tests"

[[lean_exe]]
name = "capture"
root = "Capture"
srcDir = "tests"
