# Tests: `lake test` checks the model against results recorded from the GNU
# assembler and from a real processor: single instructions, and the example
# programs run whole as Linux executables. `lake exe capture` regenerates
# those results, which needs x86-64 Linux with `as` and `cc`.

[[lean_lib]]
name = "Tests"
srcDir = "tests"

[[lean_exe]]
name = "tests"
root = "TestsMain"
srcDir = "tests"

[[lean_exe]]
name = "capture"
root = "Capture"
srcDir = "tests"
