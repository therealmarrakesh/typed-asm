name = "typed-assembly"
version = "0.1.0"
defaultTargets = ["TypedAsm", "Sum", "Swap", "Frame", "Ops", "Index", "Rejected", "sum", "swap", "frame", "ops", "index"]
testDriver = "tests"

# The core library: machine model, instruction set, semantics, type system.
# The glob includes TypedAsm.Tactic, which the root module does not import.
[[lean_lib]]
name = "TypedAsm"
srcDir = "core"
globs = ["TypedAsm.*"]

# Examples live in examples/<Name>/, one folder each:
#
#   <Name>Program.lean   the program and how to run it in the model
#   <Name>.lean          its typing and the proof that it is safe
#
# The executable is built from the program file alone, so it does not link
# the tactics. Run one with `lake exe <name>`.

[[lean_lib]]
name = "Sum"
srcDir = "examples/Sum"
roots = ["Sum", "SumProgram"]

[[lean_exe]]
name = "sum"
root = "SumProgram"
srcDir = "examples/Sum"

[[lean_lib]]
name = "Swap"
srcDir = "examples/Swap"
roots = ["Swap", "SwapProgram"]

[[lean_exe]]
name = "swap"
root = "SwapProgram"
srcDir = "examples/Swap"

[[lean_lib]]
name = "Frame"
srcDir = "examples/Frame"
roots = ["Frame", "FrameProgram"]

[[lean_exe]]
name = "frame"
root = "FrameProgram"
srcDir = "examples/Frame"

[[lean_lib]]
name = "Ops"
srcDir = "examples/Ops"
roots = ["Ops", "OpsProgram"]

[[lean_exe]]
name = "ops"
root = "OpsProgram"
srcDir = "examples/Ops"

[[lean_lib]]
name = "Index"
srcDir = "examples/Index"
roots = ["Index", "IndexProgram"]

[[lean_exe]]
name = "index"
root = "IndexProgram"
srcDir = "examples/Index"

# Not a program to run: instructions the type system rejects, with the
# messages it gives, checked at build time.
[[lean_lib]]
name = "Rejected"
srcDir = "examples/Rejected"

# Tests: `lake test` checks the model against results recorded from the GNU
# assembler and from a real processor. `lake exe capture` regenerates those
# results, which needs x86-64 Linux with `as` and `cc`.

[[lean_lib]]
name = "Tests"
srcDir = "tests"

[[lean_exe]]
name = "tests"
root = "TestsMain"
srcDir = "tests"

[[lean_exe]]
name = "capture"
root = "Capture"
srcDir = "tests"
