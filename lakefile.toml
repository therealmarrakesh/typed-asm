name = "typed-assembly"
version = "0.1.0"
defaultTargets = ["TypedAsm", "sum", "swap", "frame"]

# The core library: machine model, instruction set, semantics.
[[lean_lib]]
name = "TypedAsm"
srcDir = "core"

# Examples live in examples/<Name>/, one folder each, with the program in
# examples/<Name>/<Name>.lean. Each is an executable that can `import TypedAsm`.
# Run one with `lake exe <name>`.

[[lean_exe]]
name = "sum"
root = "Sum"
srcDir = "examples/Sum"

[[lean_exe]]
name = "swap"
root = "Swap"
srcDir = "examples/Swap"

[[lean_exe]]
name = "frame"
root = "Frame"
srcDir = "examples/Frame"
