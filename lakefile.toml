name = "typed-assembly"
version = "0.1.0"
defaultTargets = ["Core", "sum"]

# The core library: machine model, instruction set, semantics.
[[lean_lib]]
name = "Core"
srcDir = "core"

# Examples live in examples/<Name>/, one folder each, with the program in
# examples/<Name>/<Name>.lean. Each is an executable that can `import Core`.
# Run one with `lake exe <name>`.

[[lean_exe]]
name = "sum"
root = "Sum"
srcDir = "examples/Sum"
