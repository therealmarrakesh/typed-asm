name = "typed-assembly"
version = "0.1.0"
defaultTargets = ["TypedAsm", "Sum", "Swap", "Frame", "Ops", "Index", "Echo", "Table", "Dispatch", "List", "Fact", "Buffer", "Keep", "Alloc", "Cat", "Stat", "Args", "Own", "Double", "Fresh", "Rejected", "sum", "swap", "frame", "ops", "index", "echo", "table", "dispatch", "list", "fact", "buffer", "keep", "alloc", "cat", "stat", "args", "own", "double", "fresh"]
testDriver = "tests"

# The core library: machine model, instruction set, semantics, type system.
# The glob includes TypedAsm.Tactic, which the root module does not import.
[[lean_lib]]
name = "TypedAsm"
srcDir = "core"
globs = ["TypedAsm.*"]

# Examples live in examples/<Name>/, one folder each:
#
#   <Name>Program.lean   the program and how to run it in the model
#   <Name>.lean          its typing and the proof that it is safe
#   <Name>Main.lean      the command line of its executable
#
# The executable is built from the program file alone, so it does not link
# the tactics. Run one with `lake exe <name>`.

[[lean_lib]]
name = "Sum"
srcDir = "examples/Sum"
roots = ["Sum", "SumProgram"]

[[lean_exe]]
name = "sum"
root = "SumMain"
srcDir = "examples/Sum"

[[lean_lib]]
name = "Swap"
srcDir = "examples/Swap"
roots = ["Swap", "SwapProgram"]

[[lean_exe]]
name = "swap"
